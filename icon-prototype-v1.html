<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイコン試作 v1 | ニッポン発生観測所</title>
<link rel="stylesheet" href="style.css">
<style>
  .prototype-page{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:48px 28px 72px}
  .prototype-kicker{font-family:var(--font-lat);font-size:11px;letter-spacing:.28em;color:var(--lime);margin:0 0 12px}
  .prototype-page h1{font-size:clamp(30px,4vw,52px);margin:0 0 12px;line-height:1.1}
  .prototype-lead{color:var(--txt-dim);font-size:14px;line-height:1.9;margin:0 0 34px}
  .prototype-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .prototype-card{min-height:300px;padding:18px 14px 16px;border:1px solid rgba(120,160,220,.2);border-radius:18px;background:rgba(7,16,34,.62);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
  .prototype-art{width:160px;height:160px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(90,210,255,.16))}
  .prototype-card h2{font-size:17px;margin:8px 0 3px}
  .prototype-card p{font-family:var(--font-lat);font-size:9px;letter-spacing:.18em;color:var(--txt-faint);margin:0}
  .prototype-size{font-family:var(--font-num);font-size:11px;color:var(--txt-dim);margin-top:10px}
  .prototype-scale{display:flex;align-items:center;gap:9px;margin-top:14px;color:var(--txt-faint);font-family:var(--font-lat);font-size:9px;letter-spacing:.12em}
  .prototype-scale img{width:28px;height:28px;object-fit:contain}
  .prototype-scale img:last-child{width:48px;height:48px}
  @media(max-width:760px){.prototype-page{padding:30px 16px 50px}.prototype-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.prototype-card{min-height:250px;padding:14px 8px}.prototype-art{width:120px;height:120px}}
</style>
</head>
<body>
<div class="stage">
  <div class="stars"></div><div class="stars2"></div>
  <main class="prototype-page">
    <p class="prototype-kicker">ICON SYSTEM / PROTOTYPE 01</p>
    <h1>観測ピクトグラム 試作</h1>
    <p class="prototype-lead">発光ピクトグラム型。大きく見せても、小さく表示してもイベントの種類が判別できるかを確認するための試作です。</p>
    <section class="prototype-grid" aria-label="アイコン試作一覧">
      <article class="prototype-card">
        <img class="prototype-art" src="assets/icons/prototype-v1/delivery.png" alt="宅配便">
        <div><h2>宅配便</h2><p>DELIVERY</p><div class="prototype-size">24px / 48px</div></div>
        <div class="prototype-scale"><span>SIZE</span><img src="assets/icons/prototype-v1/delivery.png" alt=""><img src="assets/icons/prototype-v1/delivery.png" alt=""></div>
      </article>
      <article class="prototype-card">
        <img class="prototype-art" src="assets/icons/prototype-v1/visitor.png" alt="訪日外国人">
        <div><h2>訪日外国人</h2><p>VISITOR</p><div class="prototype-size">24px / 48px</div></div>
        <div class="prototype-scale"><span>SIZE</span><img src="assets/icons/prototype-v1/visitor.png" alt=""><img src="assets/icons/prototype-v1/visitor.png" alt=""></div>
      </article>
      <article class="prototype-card">
        <img class="prototype-art" src="assets/icons/prototype-v1/ambulance.png" alt="救急車出動">
        <div><h2>救急車出動</h2><p>AMBULANCE</p><div class="prototype-size">24px / 48px</div></div>
        <div class="prototype-scale"><span>SIZE</span><img src="assets/icons/prototype-v1/ambulance.png" alt=""><img src="assets/icons/prototype-v1/ambulance.png" alt=""></div>
      </article>
      <article class="prototype-card">
        <img class="prototype-art" src="assets/icons/prototype-v1/blood.png" alt="献血">
        <div><h2>献血</h2><p>BLOOD DONATION</p><div class="prototype-size">24px / 48px</div></div>
        <div class="prototype-scale"><span>SIZE</span><img src="assets/icons/prototype-v1/blood.png" alt=""><img src="assets/icons/prototype-v1/blood.png" alt=""></div>
      </article>
    </section>
  </main>
</div>
</body>
</html>
